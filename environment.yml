# conda env create -f environment.yml && conda activate flexrecsys
# Python 3.11 and NumPy < 2 
name: flexrecsys
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - numpy<2
  - pandas
  - pyarrow
  - scipy
  - scikit-learn
  - scikit-surprise=1.1.4
  - pytorch
  - matplotlib
  - requests
  - jupyterlab
